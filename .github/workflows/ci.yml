name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: sh -n scripts/bundle.sh
      - run: bash -n scripts/make-signing-identity.sh
      - run: bash -n scripts/package-release.sh
      - run: bash -n scripts/verify-release.sh
